[package]
name = "price-engine"
version = "0.1.0"
edition = "2021"
description = "RapidMaker pricing core: parses models and computes print quotes"
license = "MIT"

[lib]
name = "price_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.36", features = ["serialize"] }
stl_io = "0.5"
smallvec = "1"
approx = "0.5"
