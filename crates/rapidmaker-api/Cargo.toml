[package]
name = "rapidmaker-api"
version = "0.1.0"
edition = "2021"
description = "RapidMaker web API and static asset server"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-full", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
price-engine = { path = "../price-engine" }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
bytesize = "1"
serde_with = "3"
config = { version = "0.14", default-features = false, features = ["yaml"] }
figment = { version = "0.10", features = ["yaml", "env"] }
once_cell = "1"
async-tempfile = "0.7"
